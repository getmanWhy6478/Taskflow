[project]
name = "TaskFlow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "alembic>=1.13",
    "pwdlib[argon2]>=0.2.0",
    "psycopg[binary]>=3.2"
]

[project.optional-dependencies] #необязательные зависимости
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]

[build-system] #система собрки
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel] #указание на папку, из которой надо сделать проект
packages = ["app"]

[tool.ruff]
# Целевая версия Python
target-version = "py311"

# Исключаемые директории
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

# Максимальная длина строки
line-length = 100

[tool.ruff.lint] #это настройки линтёра
# Включаемые правила
select = [
    "E",    # pycodestyle errors (отступы и пробелы)
    "W",    # pycodestyle warnings (предупреждения)
    "F",    # pyflakes (неиспользуемые импорты и переменные)
    "I",    # isort (сортировка импортов)
    "N",    # pep8-naming (правильное именование функций, классов и т.д)
    "UP",   # pyupgrade (современный синтаксис)
    "B",    # flake8-bugbear (частые ошибки)
    "SIM",  # flake8-simplify (упрощение кода)
]

# Игнорируемые правила
ignore = [
    "B008",  # разрешаем Depends() в аргументах функций
    "E501",  # не ругаемся на длинные строки (line-length уже настроен)
]

[tool.ruff.format]
# Стиль кавычек
quote-style = "double"
# Стиль отступов
indent-style = "space"