{% extends "base.html" %}
{% block title %}Доступ запрещён{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body text-center p-5">
        <div class="display-1 fw-bold text-danger mb-3">403</div>
        <i class="bi bi-shield-x display-3 text-danger mb-4"></i>
        
        <h1 class="h3 mb-3">Доступ запрещён</h1>
        
        <p class="text-muted mb-4">
          У вас недостаточно прав для просмотра этой страницы. 
          Если вы считаете, что это ошибка, обратитесь к администратору.
        </p>

        {% if detail %}
          <div class="alert alert-light border mb-4">
            <small class="text-muted">{{ detail }}</small>
          </div>
        {% endif %}

        <div class="d-flex gap-2 justify-content-center">
          <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> На главную
          </a>
          <button onclick="history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Назад
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
