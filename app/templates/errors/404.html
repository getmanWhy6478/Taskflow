{% extends "base.html" %}
{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body text-center p-5">
        <div class="display-1 fw-bold text-muted mb-3">404</div>
        <i class="bi bi-search display-3 text-primary mb-4"></i>
        
        <h1 class="h3 mb-3">Страница не найдена</h1>
        
        <p class="text-muted mb-4">
          К сожалению, страница, которую вы ищете, не существует 
          или была перемещена.
        </p>

        {% if detail %}
          <div class="alert alert-light border mb-4">
            <small class="text-muted">{{ detail }}</small>
          </div>
        {% endif %}

        <div class="d-flex gap-2 justify-content-center">
          <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> На главную
          </a>
          <button onclick="history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Назад
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
