<div class="card h-100 shadow-sm task-card task-priority-{{ task.priority.value }}">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <a href="{{ url_for('get_task', t_id=task.id) }}"
         class="text-decoration-none fw-semibold stretched-link">
        {{ task.title }}
      </a>
      <span class="badge
        {% if task.status.value == 'Выполнена' %}bg-success
        {% elif task.status.value == 'В работе' %}bg-primary
        {% else %}bg-secondary{% endif %}">
        {{ task.status.value }}
      </span>
    </div>

    {% if task.description %}
      <p class="card-text text-muted small mb-2">
        {{ task.description|truncate(100) }}
      </p>
    {% endif %}

    {% if task.due_date %}
      <p class="card-text text-muted small mb-2">
        {{ task.due_date }}
      </p>
    {% endif %}

    <div class="d-flex justify-content-between align-items-center small">
      <span class="badge rounded-pill
        {% if task.priority.value == 'Высокий' %}bg-danger
        {% elif task.priority.value == 'Средний' %}bg-warning text-dark
        {% else %}bg-success{% endif %}">
        {{ task.priority.value }}
      </span>

      <span class="text-muted">
        {% if task.user %}
          <i class="bi bi-person-fill"></i> {{ task.user.display_name }}
        {% else %}
          <i class="bi bi-person-x"></i> Не назначен
        {% endif %}
      </span>
    </div>
  </div>
</div>
