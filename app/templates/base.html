<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}FlowTask{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="{{ url_for('dashboard') }}">
        <i class="bi bi-kanban"></i> FlowTask
      </a>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if request.url.path == '/projects' %}active{% endif %}"
               href="{{ url_for('get_projects') }}">Проекты</a>
        </ul>

        {% if user %}
          <div class="d-flex align-items-center gap-2">
            {% if user.is_admin %}
            <a href="{{ url_for('get_users') }}" class="btn btn-sm btn-outline-danger">
              <i class="bi bi-shield-lock"></i> Админ
            </a>
          {% endif %}
            <a href="{{ url_for('profile') }}"
              class="text-decoration-none text-muted">
                <i class="bi bi-person-circle"></i> {{ user.username }}
            </a>
            <form action="{{ url_for('logout') }}" method="post" class="d-inline">
              <button class="btn btn-outline-secondary btn-sm">Выйти</button>
            </form>
          </div>
        {% else %}
          <div class="d-flex gap-2">
            <a href="{{ url_for('login_page') }}" class="btn btn-outline-primary btn-sm">Войти</a>
            <a href="{{ url_for('register_page') }}" class="btn btn-primary btn-sm">Регистрация</a>
          </div>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="py-3 mt-auto text-center text-muted small border-top bg-white">
    <div class="container">TaskFlow &copy; 2026</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
