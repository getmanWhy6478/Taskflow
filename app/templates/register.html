{% extends "base.html" %}
{% block content %}
<h1>Регистрация</h1>

{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

<form method="post" action="/register" class="card">
  <div class="form-group">
    <label>Логин</label>
    <input class="form-control" name="username" minlength="3" maxlength="50" required>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input class="form-control" name="email" minlength="10" required>
  </div>
  <div class="form-group">
    <label>Nickname</label>
    <input class="form-control" name="display_name" minlength="3" required>
  </div>
  <div class="form-group">
    <label>Пароль</label>
    <input class="form-control" type="password" name="password" minlength="8" required>
  </div>
  <button class="btn btn-primary">Создать аккаунт</button>
</form>
{% endblock %}
