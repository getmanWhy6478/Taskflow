{% extends "base.html" %}
{% block title %}Регистрация — TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Создание аккаунта</h1>

        {% if errors %}
          <div class="alert alert-danger">
            <ul class="mb-0">
              {% for error in errors %}
                <li>{{ error }}</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}

        <form method="post" action="{{ url_for('register_user') }}" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Логин</label>
            <input type="text" class="form-control {%if fields_errors.username%} is-invalid {%endif%}" id="username"
                   name="username" minlength="3" maxlength="50"
                   value="{{ username or '' }}" required autofocus>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="text" class="form-control {%if fields_errors.email%} is-invalid {%endif%}" id="email"
                   name="email" value="{{ email or '' }}">
          </div>

          <div class="mb-3">
            <label for="display_name" class="form-label">Никнейм</label>
            <input type="text" class="form-control {%if fields_errors.display_name%} is-invalid {%endif%}" id="display_name"
                   name="display_name" value="{{ display_name or '' }}">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control {%if fields_errors.password%} is-invalid {%endif%}" id="password"
                   name="password" minlength="8" required>
            <div class="form-text">Минимум 8 символов</div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          Уже есть аккаунт?
          <a href="{{ url_for('login_page') }}">Войти</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
